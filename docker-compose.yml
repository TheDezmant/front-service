# Запуск всего приложения (БД + API + фронтенд) одной командой:
#   docker compose up --build
# Репозиторий backend-service должен лежать рядом: ../backend-service
include:
  - path: ../backend-service/docker-compose.yml

services:
  web:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
